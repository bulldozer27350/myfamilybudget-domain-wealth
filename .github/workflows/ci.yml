name: CI - Silo Patrimoine

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test Silo Patrimoine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout des sources
        uses: actions/checkout@v4

      - name: Configuration de Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Configuration de Maven settings.xml (lecture du BOM MyFamilyBudget + publication du silo)
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<SETTINGS
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.GITHUB_TOKEN }}</password>
              </server>
              <server>
                <id>mfb-packages</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.MFB_PACKAGES_READ_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          SETTINGS

      - name: Build et Tests du Silo
        run: mvn --batch-mode clean verify

  publish-snapshot:
    name: Publication SNAPSHOT sur GitHub Packages
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout des sources
        uses: actions/checkout@v4

      - name: Configuration de Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Configuration de Maven settings.xml (lecture du BOM MyFamilyBudget + publication du silo)
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<SETTINGS
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.GITHUB_TOKEN }}</password>
              </server>
              <server>
                <id>mfb-packages</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.MFB_PACKAGES_READ_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          SETTINGS

      - name: Verifier qu'il s'agit bien d'un SNAPSHOT a publier
        id: check
        run: |
          POM_VERSION="$(mvn -q -Dexpression=project.version -DforceStdout help:evaluate)"
          echo "Version courante : $POM_VERSION"
          if [[ "$POM_VERSION" != *-SNAPSHOT ]]; then
            echo "Version stable ($POM_VERSION) sur main : rien a publier ici, la release se fait via le tag."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploiement du SNAPSHOT sur GitHub Packages
        if: steps.check.outputs.skip != 'true'
        run: mvn --batch-mode deploy -DskipTests

  release:
    name: Release GitHub (tag vX.Y.Z)
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout des sources
        uses: actions/checkout@v4

      - name: Configuration de Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Configuration de Maven settings.xml (lecture du BOM MyFamilyBudget + publication du silo)
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<SETTINGS
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.GITHUB_TOKEN }}</password>
              </server>
              <server>
                <id>mfb-packages</id>
                <username>${{ github.actor }}</username>
                <password>${{ secrets.MFB_PACKAGES_READ_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          SETTINGS

      - name: Garde-fou - version stable et coherente avec le tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          POM_VERSION="$(mvn -q -Dexpression=project.version -DforceStdout help:evaluate)"
          echo "Version du tag   : $TAG_VERSION"
          echo "Version du pom   : $POM_VERSION"
          if [[ "$POM_VERSION" == *-SNAPSHOT ]]; then
            echo "::error::Le pom.xml est encore en SNAPSHOT ($POM_VERSION). Impossible de publier une release depuis une version non figee." >&2
            exit 1
          fi
          if [[ "$POM_VERSION" != "$TAG_VERSION" ]]; then
            echo "::error::Le tag ($TAG_VERSION) ne correspond pas a la version du pom.xml ($POM_VERSION)." >&2
            exit 1
          fi

      - name: Build et Tests du Silo
        run: mvn --batch-mode clean verify

      - name: Deploiement de la release sur GitHub Packages
        run: mvn --batch-mode deploy -DskipTests

      - name: Extraction des notes de version (release-note.md)
        run: |
          awk '
            /^## \[/{ if (found) exit; found=1 }
            found && $0 != "---" { print }
          ' release-note.md > "${RUNNER_TEMP}/release-notes-body.md"
          cat "${RUNNER_TEMP}/release-notes-body.md"

      - name: Creation de la GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ runner.temp }}/release-notes-body.md
          generate_release_notes: false
